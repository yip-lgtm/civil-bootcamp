name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required track folders exist
        run: |
          set -e
          for d in \
            MIT_CEE_Structural_Design_Track \
            MIT_CEE_MEng_SMD \
            MIT_CEE_Materials_Track \
            MIT_CEE_Environmental_Track \
            MIT_CEE_Transportation_Track \
            MIT_CEE_Microbiology_Track
          do
            if [ ! -d "$d" ]; then
              echo "Missing required directory: $d"
              exit 1
            fi
            echo "OK: $d"
          done

      - name: Check INDEX files and critical course files
        run: |
          set -e
          echo "=== Structural Design Track ==="
          test -f MIT_CEE_Structural_Design_Track/00_INDEX.md
          test -f MIT_CEE_Structural_Design_Track/01_1.050_Solid_Mechanics.md
          test -f MIT_CEE_Structural_Design_Track/03_1.036_Structural_Mechanics_and_Design.md
          test -f MIT_CEE_Structural_Design_Track/06_1.013_Senior_Design_Capstone.md

          echo "=== MEng SMD ==="
          test -f MIT_CEE_MEng_SMD/00_INDEX.md
          test -f MIT_CEE_MEng_SMD/01_1.562_1.563_Structural_Design_Project.md
          test -f MIT_CEE_MEng_SMD/02_1.573_Structural_Mechanics.md

          echo "=== Materials ==="
          test -f MIT_CEE_Materials_Track/00_INDEX.md
          test -f MIT_CEE_Materials_Track/01_1.035_Multiscale_Characterization.md

          echo "=== Environmental ==="
          test -f MIT_CEE_Environmental_Track/00_INDEX.md
          test -f MIT_CEE_Environmental_Track/01_1.061_Transport_Processes.md

          echo "=== Transportation ==="
          test -f MIT_CEE_Transportation_Track/00_INDEX.md
          test -f MIT_CEE_Transportation_Track/01_1.041_1.022_Transportation_Networks.md

          echo "=== Microbiology ==="
          test -f MIT_CEE_Microbiology_Track/00_INDEX.md
          test -f MIT_CEE_Microbiology_Track/01_1.063_Fluids_and_Disease.md

          echo "All critical files present."

      - name: Count markdown files
        run: |
          count=$(find . -name "*.md" ! -path "*/.git/*" | wc -l)
          echo "Total markdown files: $count"
          if [ "$count" -lt 30 ]; then
            echo "Expected at least 30 markdown files"
            exit 1
          fi

      - name: Content-quality check (3-question format + deep dives + solutions + bilingual)
        id: content_check
        run: |
          set +e
          python3 .github/scripts/check_content.py 2>&1 | tee content_check.log
          rc=$?
          echo "exit_code=$rc" >> $GITHUB_OUTPUT
          # Don't fail the build on stub-only warnings; only on hard structural errors
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then
            echo "Content check failed with exit code $rc"
            exit $rc
          fi
          echo "Content check: warnings/errors handled (see log)"

      - name: Publish content report to GitHub step summary
        if: always()
        run: |
          {
            echo "## 📊 Content Quality Report"
            echo ""
            echo '```'
            cat content_check.log
            echo '```'
            echo ""
            echo "**Legend:**"
            echo "- \`MM\` = Mental models in 問題 1 (expect 5)"
            echo "- \`DG\` = Disagreements in 問題 2 (expect 3)"
            echo "- \`Qs\` = Deep questions in 問題 3 (expect 10)"
            echo "- \`Dives\` = Mental-model deep dives (expect ≥ 5 if expanded)"
            echo "- \`Sols\` = Detailed self-test solutions (expect ≥ 10 if expanded)"
            echo "- \`Status\` = OK (expanded) / STUB (needs expansion)"
            echo ""
            echo "**Thresholds:**"
            echo "- Minimum expanded size: 300 lines"
            echo "- Stub files receive warnings only (do not fail CI)"
            echo "- Hard errors only on broken 3-question structure or missing bilingual content"
          } >> $GITHUB_STEP_SUMMARY

      - name: Basic 3-question structure check (legacy, fast)
        run: |
          set -e
          failed=0
          for f in $(find . -name "*.md" -path "*/MIT_CEE_*Track/*" ! -name "00_INDEX.md"); do
            if ! grep -q "問題 1" "$f" || ! grep -q "問題 2" "$f" || ! grep -q "問題 3" "$f"; then
              echo "Missing required sections in: $f"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            exit 1
          fi
          echo "Legacy structure check passed"

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "- Tracks validated: 6"
            echo "- Markdown files: $(find . -name '*.md' ! -path '*/.git/*' | wc -l)"
            echo "- Status: $([ '${{ steps.content_check.outputs.exit_code }}' = '0' ] && echo '✅ All structural checks passed' || echo '⚠️ Structural errors detected')"
            echo ""
            echo "See **Content Quality Report** above for per-file detail."
          } >> $GITHUB_STEP_SUMMARY
