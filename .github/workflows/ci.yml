name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail on stub warnings (treat unexpanded files as errors)"
        required: false
        type: boolean
        default: false

# Cancel superseded runs on the same branch; never cancel main
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimal read-only permissions
permissions:
  contents: read

jobs:
  structure:
    name: Structure (folders, INDEX, file count)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required top-level CEE folders exist
        run: |
          set -e
          missing=0
          # Canonical MIT CEE Course 1-ENG structure (post-2026-08 restructure)
          for d in \
            MIT_CEE_GIRs \
            MIT_CEE_GDRs \
            MIT_CEE_Core \
            MIT_CEE_MEng_SMD \
            MIT_CEE_UREs
          do
            if [ ! -d "$d" ]; then
              echo "❌ Missing required directory: $d"
              missing=$((missing + 1))
            else
              echo "✅ $d"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "$missing required folder(s) missing"
            exit 1
          fi

      - name: Verify every top-level CEE folder has 00_INDEX.md
        run: |
          set -e
          missing=0
          for d in \
            MIT_CEE_GIRs \
            MIT_CEE_GDRs \
            MIT_CEE_Core \
            MIT_CEE_MEng_SMD \
            MIT_CEE_UREs
          do
            if [ ! -f "$d/00_INDEX.md" ]; then
              echo "❌ Missing 00_INDEX.md in $d"
              missing=$((missing + 1))
            else
              echo "✅ $d/00_INDEX.md"
            fi
          done
          # Verify each of the 3 Core Tracks has its own 00_INDEX.md
          for t in \
            MIT_CEE_Core/Track_1_Environment \
            MIT_CEE_Core/Track_2_Mechanics_Materials \
            MIT_CEE_Core/Track_3_Energy_Transportation_Societal_Systems
          do
            if [ ! -f "$t/00_INDEX.md" ]; then
              echo "❌ Missing 00_INDEX.md in $t"
              missing=$((missing + 1))
            else
              echo "✅ $t/00_INDEX.md"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "$missing INDEX file(s) missing"
            exit 1
          fi

      - name: Check critical course files
        run: |
          set -e
          for f in \
            MIT_CEE_GDRs/18.03_Differential_Equations.md \
            MIT_CEE_GDRs/1.000_Introduction_to_Computer_Programming_and_Numerical_Methods.md \
            MIT_CEE_GDRs/1.010A_Probability_Concepts_and_Applications.md \
            MIT_CEE_GDRs/1.073_Introduction_to_Environmental_Data_Analysis.md \
            MIT_CEE_GDRs/1.074_Multivariate_Data_Analysis.md \
            MIT_CEE_GDRs/1.101_Introduction_to_CEE_Design.md \
            MIT_CEE_GDRs/1.013_Senior_CEE_Design_Capstone.md \
            MIT_CEE_Core/Track_1_Environment/Fluids_Transport_Engineering/01_1.061_Transport_Processes.md \
            MIT_CEE_Core/Track_1_Environment/Fluids_Transport_Engineering/00_1.009_Climate_Change.md \
            MIT_CEE_Core/Track_1_Environment/Fluids_Transport_Engineering/05_1.106_Environmental_Fluid_Transport_Hydrology_Lab.md \
            MIT_CEE_Core/Track_1_Environment/Fluids_Transport_Engineering/06_1.107_Water_and_Air_Quality_Laboratory.md \
            MIT_CEE_Core/Track_1_Environment/Environmental_Life_Sciences/01_1.063_Fluids_and_Disease.md \
            MIT_CEE_Core/Track_2_Mechanics_Materials/Structural_Design/01_1.050_Solid_Mechanics.md \
            MIT_CEE_Core/Track_2_Mechanics_Materials/Structural_Design/03_1.036_Structural_Mechanics_and_Design.md \
            MIT_CEE_Core/Track_2_Mechanics_Materials/Structural_Design/08_1.056_Introduction_to_Structural_Design.md \
            MIT_CEE_Core/Track_2_Mechanics_Materials/Materials/01_1.035_Multiscale_Characterization.md \
            MIT_CEE_Core/Track_2_Mechanics_Materials/Materials/02_1.037_Soil_Mechanics_and_Geotechnical_Design.md \
            MIT_CEE_Core/Track_3_Energy_Transportation_Societal_Systems/Transportation_Urban_Systems/01_1.041_1.022_Transportation_Networks.md \
            MIT_CEE_Core/Track_3_Energy_Transportation_Societal_Systems/Transportation_Urban_Systems/02_1.020_Engineering_Sustainability.md \
            MIT_CEE_Core/Track_3_Energy_Transportation_Societal_Systems/Transportation_Urban_Systems/03_1.075_Water_Resource_Systems.md \
            MIT_CEE_Core/Track_3_Energy_Transportation_Societal_Systems/Transportation_Urban_Systems/04_1.102_Introduction_to_CEE_Design_II.md \
            MIT_CEE_Core/Track_3_Energy_Transportation_Societal_Systems/Transportation_Urban_Systems/05_1.022_Introduction_to_Network_Models.md \
            MIT_CEE_MEng_SMD/01_1.562_1.563_Structural_Design_Project.md \
            MIT_CEE_MEng_SMD/02_1.573_Structural_Mechanics.md \
            MIT_CEE_MEng_SMD/03_1.581_Structural_Dynamics.md \
            MIT_CEE_MEng_SMD/04_1.541_Concrete_Structures.md \
            MIT_CEE_MEng_SMD/05_1.361_1.364_Advanced_Soil_Geotech.md \
            MIT_CEE_MEng_SMD/06_1.550_Engineering_Mechanics.md \
            MIT_CEE_MEng_SMD/07_1.575_Computational_Structural_Design_Optimization.md \
            MIT_CEE_MEng_SMD/08_1.583_Topology_Optimization_of_Structures.md \
            MIT_CEE_MEng_SMD/09_1.582_Design_of_Steel_Structures.md \
            MIT_CEE_MEng_SMD/10_2.081_Plates_and_Shells.md \
            MIT_CEE_MEng_SMD/11_1.121_Advanced_Mechanics_Materials_via_ML.md \
            MIT_CEE_MEng_SMD/12_1.142_Robust_Modeling_Optimization_Computation.md \
            MIT_CEE_MEng_SMD/13_1.351_Theoretical_Soil_Mechanics.md \
            MIT_CEE_MEng_SMD/14_1.472_Innovative_Project_Delivery.md
          do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              exit 1
            fi
            echo "✅ $f"
          done

      - name: Count markdown files
        run: |
          count=$(find . -name "*.md" ! -path "*/.git/*" | wc -l)
          echo "Total markdown files: $count"
          if [ "$count" -lt 30 ]; then
            echo "Expected at least 30 markdown files"
            exit 1
          fi

  markdown_lint:
    name: Markdown lint (markdownlint-cli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run markdownlint
        run: |
          npx --yes markdownlint-cli@0.42.0 \
            --config .markdownlint.json \
            "MIT_CEE_GIRs/**/*.md" \
            "MIT_CEE_GDRs/**/*.md" \
            "MIT_CEE_Core/**/*.md" \
            "MIT_CEE_MEng_SMD/**/*.md" \
            "MIT_CEE_UREs/**/*.md" \
            README.md \
            AGENTS.md \
            || true   # non-blocking by default; see note below
        # NOTE: For now we run markdownlint with || true so we surface the
        # report without failing. Once existing files are cleaned up to match
        # the project style, remove the || true to make it a hard check.

      - name: Summarize markdownlint output
        if: always()
        run: |
          {
            echo "## 📝 Markdownlint Summary"
            echo ""
            echo "Run \`npx markdownlint-cli --config .markdownlint.json '**/*.md'\` locally for details."
            echo ""
            echo "Lint output above is informational; existing files predate the strict style."
          } >> $GITHUB_STEP_SUMMARY

  content:
    name: Content quality (3-question, deep dives, solutions, diagrams)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run content-quality check
        id: content_check
        run: |
          set +e
          python3 .github/scripts/check_content.py 2>&1 | tee content_check.log
          rc=$?
          echo "exit_code=$rc" >> $GITHUB_OUTPUT

      - name: Decide result (allow strict mode via workflow_dispatch input)
        if: always()
        id: decide
        run: |
          rc="${{ steps.content_check.outputs.exit_code }}"
          strict="${{ inputs.strict }}"
          echo "content_check_exit_code=$rc"
          echo "strict_mode=$strict"
          if [ "$rc" = "0" ]; then
            echo "result=pass" >> $GITHUB_OUTPUT
            exit 0
          fi
          # rc=1: hard errors (block)
          # rc=2: top-level error (block)
          if [ "$rc" = "1" ] || [ "$rc" = "2" ]; then
            echo "result=fail" >> $GITHUB_OUTPUT
            exit 1
          fi
          # any other rc: treat as pass for now
          echo "result=pass" >> $GITHUB_OUTPUT

      - name: Publish content report
        if: always()
        run: |
          {
            echo "## 📊 Content Quality Report"
            echo ""
            echo '```'
            cat content_check.log
            echo '```'
            echo ""
            echo "**Legend:**"
            echo "- \`MM\` = Mental models in 問題 1 (expect 5)"
            echo "- \`DG\` = Disagreements in 問題 2 (expect 3)"
            echo "- \`Qs\` = Deep questions in 問題 3 (expect 10)"
            echo "- \`Dives\` = Mental-model deep dives (expect ≥ 5 if expanded)"
            echo "- \`Sols\` = Detailed self-test solutions (expect ≥ 10 if expanded)"
            echo "- \`Diag\` = \`### N.X 圖解 / Diagram\` subsections (warn if 0)"
            echo "- \`Merm\` = Mermaid \`\`\`mermaid code blocks (warn if 0)"
            echo "- \`Status\` = OK (expanded) / STUB (needs expansion)"
            echo ""
            echo "**Thresholds:**"
            echo "- Minimum expanded size: 300 lines"
            echo "- Stub files receive warnings only (do not fail CI by default)"
            echo "- Set \`strict: true\` via **Run workflow** to fail on stubs"
          } >> $GITHUB_STEP_SUMMARY

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [structure, markdown_lint, content]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write summary
        run: |
          structure_status="${{ needs.structure.result }}"
          lint_status="${{ needs.markdown_lint.result }}"
          content_status="${{ needs.content.result }}"

          {
            echo "# 🛠 Civil-Bootcamp CI"
            echo ""
            echo "## Job results"
            echo ""
            echo "| Job | Status |"
            echo "|---|---|"
            echo "| Structure (folders, INDEX, file count) | $structure_status |"
            echo "| Markdown lint | $lint_status |"
            echo "| Content quality | $content_status |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          # Fail if any required job failed
          if [ "$structure_status" = "failure" ] || [ "$content_status" = "failure" ]; then
            echo "❌ One or more required jobs failed."
            exit 1
          fi
          echo "✅ All required jobs passed (markdownlint is advisory)."
